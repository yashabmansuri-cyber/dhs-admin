name: Build DHS Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DHS-Android-Part-*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract all project parts
        shell: bash
        run: |
          set -e
          rm -rf assembled
          mkdir assembled
          shopt -s nullglob
          parts=(DHS-Android-Part-*.zip)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "ERROR: No DHS-Android-Part-*.zip files found."
            exit 1
          fi
          echo "Found ${#parts[@]} project parts:"
          printf ' - %s\n' "${parts[@]}"
          for f in "${parts[@]}"; do
            echo "Extracting $f..."
            unzip -o "$f" -d assembled
          done
          cp -R assembled/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DHS-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
